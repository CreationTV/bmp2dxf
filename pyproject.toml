[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmp2dxf"
version = "1.1.1"
description = "Convert bitmaps (PNG/JPEG/WebP/BMP/TIFF) into clean, editable DXF vector drawings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CreationTV" }]
keywords = ["bitmap", "dxf", "vectorization", "cad", "centerline", "skeleton", "tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "ezdxf>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.16"]

[project.scripts]
bmp2dxf = "bmp2dxf.cli:main"

[tool.setuptools.packages.find]
include = ["bmp2dxf*"]

[tool.setuptools.package-data]
"bmp2dxf.web" = ["static/*", "legacy/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
